name = "cf-sub-worker"
main = "_worker.js"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# VLESS TCP 出口固定在美国西部附近，避免 Google 将亚洲边缘出口误判为中国区
[placement]
region = "aws:us-west-2"

# 定时触发器：每 30 分钟执行一次优选 IP 轮转与出口 IP 健康检查
[triggers]
crons = ["*/30 * * * *"]

[vars]
# 自定义域名：如 sub.yourdomain.com，主域名需托管在本账号；留空则使用免费 workers.dev 域名
DOMAIN = "x.subbb.dpdns.org"

# 管理员登录邮箱：首次登录后台时使用（默认 admin@example.com）
ADMIN_EMAIL = "admin@subbb.dpdns.org"

# 订阅节点标题：客户端导入订阅时展示的名称前缀
SUB_TITLE = "Preferred-IP 三网实测订阅"

# 备用反代出口 IP：遇到 Cloudflare Error 1000 时的跳板 IP，绝大多数网站走原生直连，默认留空
PROXYIP = "43.168.16.112,161.33.135.154"

# 边缘缓存时间（秒）：有效节省每日 Workers 请求额度
CACHE_TTL = "300"

# 订阅与令牌策略：严格用户隔离，关闭公共免密直连
ALLOW_PUBLIC_SUB = "0"
ALLOW_STATELESS_TOKENS = "1"
ALLOW_LEGACY_WS = "1"
ALLOW_REGION_DIRECT_FALLBACK = "1"
DEFAULT_REGION = "DIRECT"
PROFILE_UPDATE_INTERVAL_HOURS = "12"

# Preferred-IP 自动优选
OPTIMIZER_ENABLED = "1"
OPTIMIZER_BATCH = "4"
OPTIMIZER_TOP_N = "20"
CANDIDATES_PER_CIDR = "4"
PROBE_PACKETS = "4"

# Globalping：中国移动 / 联通 / 电信探针
GLOBALPING_ENABLED = "1"
GP_CM_MAGIC = "China Mobile Communications"
GP_CU_MAGIC = "CHINA UNICOM China169 Backbone"
GP_CT_MAGIC = "China Telecom"

[observability]
enabled = true
head_sampling_rate = 0.1

# KV 命名空间绑定（若使用 GitHub Actions 部署会自动创建并绑定；手动部署请填入真实 ID）
# [[kv_namespaces]]
# binding = "XS_SUB_KV"
# id = "你的KV_ID"
